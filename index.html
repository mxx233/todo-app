<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多彩待办清单｜双区域布局</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8c8dc 0%, #c8b6ff 100%);
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 装饰漂浮图案 */
        .decor {
            position: absolute;
            z-index: 0;
            opacity: 0.25;
            pointer-events: none;
        }
        .decor1 {
            top: 40px;
            left: 5%;
            width: 70px;
            transform: rotate(12deg);
        }
        .decor2 {
            top: 180px;
            right: 6%;
            width: 90px;
            transform: rotate(-8deg);
        }
        .decor3 {
            bottom: 60px;
            left: 8%;
            width: 65px;
            transform: rotate(20deg);
        }
        .decor4 {
            bottom: 120px;
            right: 10%;
            width: 80px;
            transform: rotate(-15deg);
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        /* 日历卡片 */
        .calendar-card{
            background:#fff;
            border-radius:20px;
            padding:20px;
            box-shadow:0 12px 35px rgba(0,0,0,0.1);
        }
        .calendar-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:12px;
        }
        .calendar-btn{
            background:#9d4edd;
            color:white;
            border:none;
            border-radius:8px;
            padding:6px 12px;
            cursor:pointer;
        }
        .calendar-title{
            font-weight:600;
            color:#552583;
        }
        .calendar-grid{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            gap:6px;
        }
        .week-day{
            text-align:center;
            font-size:13px;
            color:#666;
            padding:4px 0;
        }
        .day-cell{
            aspect-ratio:1/1;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
            transition:0.2s;
            position:relative;
        }
        .day-cell.empty{
            background:#f8f4fc;
            cursor:default;
        }
        .day-cell.active{
            background:#9d4edd;
            color:white;
        }
        .day-cell:hover:not(.empty){
            background:#e0c3fc;
        }
        /* 日期下方小圆点标记有任务 */
        .day-cell.has-task::after{
            content:"";
            width:5px;
            height:5px;
            border-radius:50%;
            background:#ff758f;
            position:absolute;
            bottom:4px;
        }

        /* 日历内的当日待办列表 */
        .day-todo-wrap{
            margin-top:16px;
            padding-top:12px;
            border-top:1px solid #eee;
        }
        .day-todo-item{
            display:flex;
            align-items:center;
            gap:8px;
            padding:6px 0;
            font-size:14px;
        }
        .day-todo-item.done{
            text-decoration:line-through;
            color:#999;
        }
        .day-todo-date{
            color:#c94c4c;
            margin-left:auto;
            font-size:13px;
        }

        /* 最近待办卡片 */
        .recent-card{
            background:#fff;
            border-radius:20px;
            padding:24px;
            box-shadow:0 12px 35px rgba(0,0,0,0.1);
        }
        .recent-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:16px;
        }
        .recent-title{
            font-size:18px;
            font-weight:600;
            color:#2d7d70;
        }
        .add-btn-round{
            width:34px;
            height:34px;
            border-radius:50%;
            background:#9d4edd;
            color:#fff;
            border:none;
            font-size:20px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        #todoInput {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0c3fc;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        #todoInput:focus {
            border-color: #9d4edd;
        }

        #addBtn {
            padding: 0 16px;
            background: #9d4edd;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        #addBtn:hover {
            background: #7b2cbf;
        }

        .todo-list {
            list-style: none;
            margin-bottom: 16px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding:10px 0;
            border-bottom:1px solid #f3f3f3;
        }
        .todo-item:last-child{
            border-bottom:none;
        }
        .todo-left{
            display:flex;
            align-items:center;
            gap:8px;
        }
        .todo-text {
            font-size:15px;
            cursor: pointer;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }
        .todo-date-tag{
            font-size:13px;
            color:#c94c4c;
        }
        .delete-btn {
            background: #ff758f;
            color: white;
            border: none;
            border-radius: 8px;
            padding:4px 8px;
            cursor: pointer;
            font-size:12px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #ff5277;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #fff0f6;
            border-radius: 12px;
            font-size: 14px;
            color: #555;
        }

        #clearAllBtn {
            background: #ff9bb3;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        #clearAllBtn:hover {
            background: #ff758f;
        }

        .empty-tip {
            text-align: center;
            color: #999;
            padding: 24px 0;
        }
    </style>
</head>
<body>
    <!-- 四周装饰图案：星星、爱心、小云朵 -->
    <svg class="decor decor1" viewBox="0 0 100 100">
        <path fill="#9d4edd" d="M50 0 L61.2 38.8 L100 38.8 L69.1 61.2 L79.4 100 L50 76.3 L20.6 100 L30.9 61.2 L0 38.8 L38.8 38.8 Z"/>
    </svg>
    <svg class="decor decor2" viewBox="0 0 100 100">
        <path fill="#ff758f" d="M50,88.3C25,62 0,43.3 0,25C0,10 12.5,0 25,0C37.5,0 50,10 50,25C50,10 62.5,0 75,0C87.5,0 100,10 100,25C100,43.3 75,62 50,88.3Z"/>
    </svg>
    <svg class="decor decor3" viewBox="0 0 100 100">
        <path fill="#7b2cbf" d="M25,50 C25,35 40,25 55,25 C70,25 85,35 85,50 C85,65 70,75 55,75 C40,75 25,65 25,50 Z"/>
    </svg>
    <svg class="decor decor4" viewBox="0 0 100 100">
        <path fill="#c8b6ff" d="M50 0 L61.2 38.8 L100 38.8 L69.1 61.2 L79.4 100 L50 76.3 L20.6 100 L30.9 61.2 L0 38.8 L38.8 38.8 Z"/>
    </svg>

    <div class="container">
        <!-- 卡片1：日历 + 选中日期的待办 -->
        <div class="calendar-card">
            <div class="calendar-header">
                <button class="calendar-btn" id="prevMonth">◀</button>
                <div class="calendar-title" id="calendarTitle"></div>
                <button class="calendar-btn" id="nextMonth">▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <div class="week-day">日</div>
                <div class="week-day">一</div>
                <div class="week-day">二</div>
                <div class="week-day">三</div>
                <div class="week-day">四</div>
                <div class="week-day">五</div>
                <div class="week-day">六</div>
            </div>
            <div class="day-todo-wrap" id="dayTodoWrap"></div>
        </div>

        <!-- 卡片2：最近待办 -->
        <div class="recent-card">
            <div class="recent-head">
                <div class="recent-title">最近待办</div>
                <button class="add-btn-round" id="showInputBtn">+</button>
            </div>
            <div class="input-area" id="inputArea" style="display:none;">
                <input type="text" id="todoInput" placeholder="输入你的待办事项...">
                <button id="addBtn">添加</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
            <div class="stats-bar">
                <div id="statsText">总任务：0｜已完成：0</div>
                <button id="clearAllBtn">清空全部</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDate = new Date();
        // 数据结构：{ "2026-09-10":[{text:"xxx",completed:false},...] }
        let dateTodos = JSON.parse(localStorage.getItem("dateTodoList")) || {};

        // 预设模板任务
        const presetTasks = [
            "完成作业",
            "复习今天知识点",
            "整理笔记",
            "运动半小时"
        ];

        const calendarTitle = document.getElementById("calendarTitle");
        const calendarGrid = document.getElementById("calendarGrid");
        const prevMonthBtn = document.getElementById("prevMonth");
        const nextMonthBtn = document.getElementById("nextMonth");
        const dayTodoWrap = document.getElementById("dayTodoWrap");
        const showInputBtn = document.getElementById("showInputBtn");
        const inputArea = document.getElementById("inputArea");
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const statsText = document.getElementById('statsText');
        const clearAllBtn = document.getElementById('clearAllBtn');

        // 格式化日期 yyyy-MM-dd
        function formatDate(d){
            const y = d.getFullYear();
            const m = String(d.getMonth()+1).padStart(2,"0");
            const day = String(d.getDate()).padStart(2,"0");
            return `${y}-${m}-${day}`;
        }
        // 格式化显示：MM月dd日
        function formatShowDate(d){
            const m = d.getMonth()+1;
            const day = d.getDate();
            return `${m}月${day}日`;
        }

        // 渲染日历
        function renderCalendar(){
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth();
            calendarTitle.innerText = `${y}年${m+1}月`;
            const cells = calendarGrid.querySelectorAll(".day-cell");
            cells.forEach(c=>c.remove());

            const firstDay = new Date(y,m,1).getDay();
            const totalDays = new Date(y,m+1,0).getDate();

            for(let i=0;i<firstDay;i++){
                const div = document.createElement("div");
                div.className="day-cell empty";
                calendarGrid.appendChild(div);
            }
            for(let d=1;d<=totalDays;d++){
                const div = document.createElement("div");
                div.className="day-cell";
                div.innerText = d;
                const cellDate = new Date(y,m,d);
                const key = formatDate(cellDate);
                // 标记：这天有没有任务
                if(dateTodos[key] && dateTodos[key].length>0){
                    div.classList.add("has-task");
                }
                if(formatDate(selectedDate) === key){
                    div.classList.add("active");
                }
                div.onclick = ()=>{
                    selectedDate = new Date(y,m,d);
                    renderCalendar();
                    renderDayTodo();
                    renderRecentTodo();
                }
                calendarGrid.appendChild(div);
            }
        }

        // 渲染日历卡片内【选中日期的待办】
        function renderDayTodo(){
            const dateKey = formatDate(selectedDate);
            let todos = dateTodos[dateKey] || [];
            if(todos.length ===0){
                todos = presetTasks.map(t=>{
                    return {text:t,completed:false}
                })
                dateTodos[dateKey] = todos;
                saveData();
            }
            dayTodoWrap.innerHTML = "";
            todos.forEach((todo,index)=>{
                const div = document.createElement("div");
                div.className = `day-todo-item ${todo.completed?"done":""}`;
                div.innerHTML = `
                    <input type="checkbox" ${todo.completed?"checked":""}>
                    <span>${todo.text}</span>
                    <span class="day-todo-date">${formatShowDate(selectedDate)}</span>
                `;
                div.querySelector("input").onchange = ()=>{
                    todos[index].completed = !todos[index].completed;
                    saveData();
                }
                dayTodoWrap.appendChild(div);
            })
        }

        // 渲染下方【最近待办】：所有日期的任务，按日期排序
        function renderRecentTodo() {
            const allTasks = [];
            for(const dateKey in dateTodos){
                const list = dateTodos[dateKey];
                list.forEach(item=>{
                    allTasks.push({
                        dateKey:dateKey,
                        dateObj:new Date(dateKey),
                        text:item.text,
                        completed:item.completed
                    })
                })
            }
            // 按日期升序
            allTasks.sort((a,b)=>a.dateObj - b.dateObj);

            todoList.innerHTML = '';
            if(allTasks.length === 0){
                todoList.innerHTML = '<div class="empty-tip">暂无待办，快去添加任务吧 📝</div>';
            }else{
                allTasks.forEach((task, idx) => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${task.completed ? 'completed' : ''}`;
                    li.innerHTML = `
                        <div class="todo-left">
                            <input type="checkbox" ${task.completed?"checked":""}>
                            <span class="todo-text">${task.text}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <span class="todo-date-tag">${formatShowDate(task.dateObj)}</span>
                            <button class="delete-btn">删除</button>
                        </div>
                    `;
                    li.querySelector("input").addEventListener('change', ()=>{
                        const arr = dateTodos[task.dateKey];
                        const pos = arr.findIndex(x=>x.text===task.text);
                        if(pos>-1) arr[pos].completed = !arr[pos].completed;
                        saveData();
                    });
                    li.querySelector('.delete-btn').addEventListener('click', ()=>{
                        const arr = dateTodos[task.dateKey];
                        const pos = arr.findIndex(x=>x.text===task.text);
                        if(pos>-1) arr.splice(pos,1);
                        saveData();
                    });
                    todoList.appendChild(li);
                });
            }
            updateStats();
        }

        function updateStats(){
            let total=0,done=0;
            for(const k in dateTodos){
                const arr = dateTodos[k];
                total += arr.length;
                done += arr.filter(x=>x.completed).length;
            }
            statsText.innerText = `总任务：${total}｜已完成：${done}`;
        }

        function saveData(){
            localStorage.setItem("dateTodoList",JSON.stringify(dateTodos));
            renderCalendar();
            renderDayTodo();
            renderRecentTodo();
        }

        function addTodo(){
            const text = todoInput.value.trim();
            if(!text) return;
            const dateKey = formatDate(selectedDate);
            if(!dateTodos[dateKey]) dateTodos[dateKey] = [];
            dateTodos[dateKey].push({text: text, completed: false});
            todoInput.value = '';
            inputArea.style.display="none";
            saveData();
        }

        // 点击+号显示输入框
        showInputBtn.onclick = ()=>{
            inputArea.style.display = inputArea.style.display === "none" ? "flex":"none";
        }

        // 月份切换
        prevMonthBtn.onclick = ()=>{
            currentDate.setMonth(currentDate.getMonth()-1);
            renderCalendar();
            renderDayTodo();
        }
        nextMonthBtn.onclick = ()=>{
            currentDate.setMonth(currentDate.getMonth()+1);
            renderCalendar();
            renderDayTodo();
        }

        addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keydown', (e)=>{
            if(e.key === 'Enter') addTodo();
        });

        clearAllBtn.addEventListener('click', ()=>{
            if(confirm(`确定清空全部待办吗？`)){
                dateTodos = {};
                saveData();
            }
        });

        renderCalendar();
        renderDayTodo();
        renderRecentTodo();
    </script>
</body>
</html>
